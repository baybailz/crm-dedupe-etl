# Two targets:
#   duckdb    - zero-cost local demo (default). `pip install dbt-duckdb` and go.
#   snowflake - the real deployment target. Uses env vars so no secrets live in the repo.
crm_dedupe:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: crm_dedupe.duckdb
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CRM_DEMO') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: dedupe
      threads: 4
