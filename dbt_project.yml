name: crm_dedupe
version: "1.0.0"
profile: crm_dedupe

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# Pin text columns so sparse ones (e.g. an all-empty address_2) don't get
# type-inferred as integers.
seeds:
  crm_dedupe:
    +column_types:
      zip: varchar(10)
      address_2: varchar
      address_3: varchar
      website: varchar
      primary_phone_number: varchar
    crm_company:
      +column_types:
        zip: varchar(10)
        phone_number: varchar(20)
    # Generated by scripts/load_next.py; pinned fully so the empty (reset)
    # state still yields correctly typed columns.
    vendor_records:
      +column_types:
        source_file: varchar
        row_num: integer
        company_name: varchar
        address_1: varchar
        address_2: varchar
        address_3: varchar
        city: varchar
        state: varchar
        zip: varchar(10)
        website: varchar
        primary_phone_number: varchar

models:
  crm_dedupe:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
