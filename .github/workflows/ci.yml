# Every pull request: lint the SQL and build the whole project with its tests
# against a throwaway DuckDB. Nothing merges red.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "state/**", "seeds/purchased_company.csv"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sqlfluff lint
        run: sqlfluff lint models macros tests
      - name: dbt build --full-refresh
        run: dbt build --full-refresh --no-use-colors
      - name: export smoke test
        run: python scripts/export_json.py --action load_next --dbt-log /dev/null
