# One dispatchable workflow = one pipeline run:
# stage one vendor file -> dbt build (tag:master_data) -> publish JSON.
# Fails closed: a red build commits nothing.
name: pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: load_next
        options: [load_next, reset]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install dbt-core dbt-duckdb duckdb

      # shell: bash => pipefail, so a failing step still fails through tee
      - name: Stage next vendor file (Python)
        shell: bash
        run: python scripts/stage_for_dbt.py --action "${{ inputs.action || 'load_next' }}" 2>&1 | tee /tmp/python.log

      - name: Run dbt (seeds + models + tests)
        shell: bash
        run: |
          FLAGS=""
          [ "${{ inputs.action || 'load_next' }}" = "reset" ] && FLAGS="--full-refresh"
          dbt build --select tag:master_data $FLAGS --no-use-colors 2>&1 | tee /tmp/dbt.log
        env:
          DBT_PROFILES_DIR: .

      - name: Export tables for the web console
        run: >
          python scripts/export_json.py
          --action "${{ inputs.action || 'load_next' }}"
          --python-log /tmp/python.log --dbt-log /tmp/dbt.log

      - name: Rebuild the presentation snapshot
        run: python scripts/build_presentation.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state seeds/vendor_records.csv docs/data
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "pipeline: ${{ inputs.action || 'load_next' }} ($(date -u +%FT%TZ))"
          git push
