# Singular test properties. Generic tests (unique, not_null,
# accepted_values) live with their models; these stand alone.
version: 2

data_tests:
  - name: assert_match_keys_present
    description: >
      Fails the build if any match key is blank. A blank key scores 0.0
      against everything, so the record matches nothing and imports as
      new: a silent duplicate in master data.
    config:
      tags: ['scenario']

  - name: assert_unique_candidate_pairs
    description: >
      Fails the build if a candidate pair is produced twice. Adding a
      blocking pass with union all instead of union would double every
      score and inflate the duplicate report.
    config:
      tags: ['scenario']
